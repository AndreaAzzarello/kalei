<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="256" height="256">
  <!-- Hand-tuned geometry for 16 and 24 px: narrower, more spaced petals, larger dot and halo. -->
  <rect x="1" y="1" width="38" height="38" rx="9" fill="#6C5FF1" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1"/>
  <g transform="translate(20 20) scale(.8) translate(-20 -20)">
    <ellipse cx="20" cy="9.5" rx="5" ry="8" fill="#FFFFFF"/>
    <ellipse cx="20" cy="9.5" rx="5" ry="8" fill="#FFFFFF" transform="rotate(120 20 20)"/>
    <ellipse cx="20" cy="9.5" rx="5" ry="8" fill="#FFFFFF" transform="rotate(240 20 20)"/>
    <circle cx="20" cy="20" r="5.6" fill="#6C5FF1"/>
    <circle cx="20" cy="20" r="4" fill="#FFE08A"/>
  </g>
</svg>
