<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="256" height="256">
  <!-- Kalei app icon, geometry for 32/48/256 px. Container #6C5FF1, petals #FFFFFF, dot #FFE08A on a container-coloured halo. -->
  <rect x="1" y="1" width="38" height="38" rx="9" fill="#6C5FF1" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1"/>
  <g transform="translate(20 20) scale(.8) translate(-20 -20)">
    <ellipse cx="20" cy="10" rx="6.5" ry="9.5" fill="#FFFFFF"/>
    <ellipse cx="20" cy="10" rx="6.5" ry="9.5" fill="#FFFFFF" transform="rotate(120 20 20)"/>
    <ellipse cx="20" cy="10" rx="6.5" ry="9.5" fill="#FFFFFF" transform="rotate(240 20 20)"/>
    <circle cx="20" cy="20" r="5.2" fill="#6C5FF1"/>
    <circle cx="20" cy="20" r="3.6" fill="#FFE08A"/>
  </g>
</svg>
